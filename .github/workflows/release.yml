name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install frontend dependencies
        working-directory: signalist
        run: npm install

      # The release body is built before tauri-action runs, because that step is
      # what creates the release — there is no editing it afterwards without a
      # second API call.
      - name: Extract release notes from CHANGELOG
        id: notes
        working-directory: signalist
        run: |
          {
            echo "body<<SIGNALIST_NOTES_EOF"
            ./release/changelog-section.sh "${{ github.ref_name }}" ../CHANGELOG.md
            echo "SIGNALIST_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: signalist
          tagName: ${{ github.ref_name }}
          releaseName: "Signalist ${{ github.ref_name }}"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Add first-run README to DMG
        working-directory: signalist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./release/inject-dmg-readme.sh "${{ github.ref_name }}" "release/DMG_README.txt"
