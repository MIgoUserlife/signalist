[package]
name = "signalist"
version = "0.5.5"
description = "A Tauri App"
authors = ["Mykhailo Laskarzhevskyi"]
edition = "2021"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "signalist_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable", "devtools", "macos-private-api", "tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-store = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
window-vibrancy = "0.5"

# Deleting a shortcut's session is `+[WKWebsiteDataStore
# removeDataStoreForIdentifier:completionHandler:]` (macOS 14+), so the app
# never has to know where WebKit keeps its stores. wry already pulls these exact
# versions in, so naming them here adds no crate to the build.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSUUID", "NSError", "NSString", "NSArray"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "block2", "WKWebsiteDataStore"] }
block2 = "0.6"

